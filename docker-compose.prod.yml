services:
  web:
    image: ghcr.io/verybigmotion/openreply:latest
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    env_file: .env
    ports:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    image: ghcr.io/verybigmotion/openreply:latest
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file: .env
    depends_on:
      web:
        condition: service_healthy

  cron:
    image: ghcr.io/verybigmotion/openreply:latest
    restart: unless-stopped
    command: ["sh", "scripts/cron.sh"]
    env_file: .env
    environment:
      CRON_BASE_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redisdata:
